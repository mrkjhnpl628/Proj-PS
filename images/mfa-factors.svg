<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Three authentication factors" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="480" height="300" rx="16" fill="#eef3ff"/><rect x="20" y="30" width="140" height="190" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="90" y="95" font-size="38" text-anchor="middle">🧠</text><text x="90" y="140" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="Arial,sans-serif">Something you know</text><text x="90" y="165" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial,sans-serif">Password, PIN</text><rect x="175" y="30" width="140" height="190" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="245" y="95" font-size="38" text-anchor="middle">🔑</text><text x="245" y="140" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="Arial,sans-serif">Something you have</text><text x="245" y="165" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial,sans-serif">Phone, security key</text><rect x="330" y="30" width="140" height="190" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="400" y="95" font-size="38" text-anchor="middle">👆</text><text x="400" y="140" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="Arial,sans-serif">Something you are</text><text x="400" y="165" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial,sans-serif">Fingerprint, face</text><text x="240" y="268" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a" font-family="Arial,sans-serif">MFA = two or more different factors</text></svg>