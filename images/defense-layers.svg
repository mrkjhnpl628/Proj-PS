<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Six layers of platform security, from physical to data" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="480" height="300" rx="16" fill="#eef3ff"/><rect x="40" y="18" width="400" height="36" rx="8" fill="#1d4ed8"/><text x="240" y="41" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">Data: encryption at rest and in transit</text><rect x="40" y="61" width="400" height="36" rx="8" fill="#2563eb"/><text x="240" y="84" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">Network: firewalls, VPN, IDS/IPS</text><rect x="40" y="104" width="400" height="36" rx="8" fill="#0891b2"/><text x="240" y="127" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">Application: sandboxing, code signing</text><rect x="40" y="147" width="400" height="36" rx="8" fill="#0e7490"/><text x="240" y="170" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">Operating system: patching, least privilege</text><rect x="40" y="190" width="400" height="36" rx="8" fill="#7c3aed"/><text x="240" y="213" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">Firmware and boot: Secure Boot, TPM</text><rect x="40" y="233" width="400" height="36" rx="8" fill="#6d28d9"/><text x="240" y="256" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">Physical: locks, tamper protection</text></svg>