<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Chain of trust from TPM to drivers and apps" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="480" height="300" rx="16" fill="#eef3ff"/><text x="240" y="70" font-size="18" font-weight="700" text-anchor="middle" fill="#1e3a8a" font-family="Arial,sans-serif">Each stage verifies the next</text><rect x="14" y="110" width="78" height="80" rx="10" fill="#7c3aed"/><text x="53" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">TPM</text><text x="53" y="166" fill="#fff" font-size="11" text-anchor="middle" font-family="Arial,sans-serif">root of trust</text><text x="99" y="156" font-size="20" fill="#1e3a8a" text-anchor="middle">›</text><rect x="107" y="110" width="78" height="80" rx="10" fill="#2563eb"/><text x="146" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">UEFI</text><text x="146" y="166" fill="#fff" font-size="11" text-anchor="middle" font-family="Arial,sans-serif">firmware</text><text x="192" y="156" font-size="20" fill="#1e3a8a" text-anchor="middle">›</text><rect x="200" y="110" width="78" height="80" rx="10" fill="#2563eb"/><text x="239" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">Boot-</text><text x="239" y="166" fill="#fff" font-size="11" text-anchor="middle" font-family="Arial,sans-serif">loader</text><text x="285" y="156" font-size="20" fill="#1e3a8a" text-anchor="middle">›</text><rect x="293" y="110" width="78" height="80" rx="10" fill="#2563eb"/><text x="332" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">OS</text><text x="332" y="166" fill="#fff" font-size="11" text-anchor="middle" font-family="Arial,sans-serif">kernel</text><text x="378" y="156" font-size="20" fill="#1e3a8a" text-anchor="middle">›</text><rect x="386" y="110" width="78" height="80" rx="10" fill="#2563eb"/><text x="425" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">Drivers</text><text x="425" y="166" fill="#fff" font-size="11" text-anchor="middle" font-family="Arial,sans-serif">and apps</text><text x="240" y="240" font-size="13" text-anchor="middle" fill="#334155" font-family="Arial,sans-serif">If any signature check fails, boot stops and an alert is raised.</text></svg>